name: Refresh data

# Pulls the latest Washington WARN notices and World Bank PPP figures, commits
# any change, then republishes the site. Pushes made with GITHUB_TOKEN don't
# trigger other workflows, so the publish job is called directly.
on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Washington WARN notices
        run: python scripts/fetch_warn.py
      - name: World Bank PPP and exchange rates
        run: python scripts/fetch_ppp.py
      - id: commit
        name: Commit if anything changed
        run: |
          if git diff --quiet -- site; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/wa-layoffs/data.json site/salary-converter/data.json
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
